<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>你画我猜 · 一起开画</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header><div class="brand"><span class="logo">✎</span><div><h1>一起开画</h1><p>你画我猜 · 好友在线派对</p></div></div><div class="live"><i></i> 实时联机</div></header>
  <main>
    <section id="lobby" class="lobby panel">
      <div class="hero"><div class="hero-art">🎨</div><div class="eyebrow">画画 · 猜词 · 欢乐</div><h2>灵魂画手，准备好了吗？</h2><p>创建房间邀请朋友，画得越抽象，笑得越大声。</p></div>
      <label for="playerName">你的昵称</label><input id="playerName" maxlength="16" placeholder="给自己起个名字" value="画画新手">
      <div class="lobby-actions"><button id="createBtn" class="primary">＋ 创建房间</button><div class="join-row"><input id="roomCode" maxlength="5" placeholder="输入 5 位邀请码"><button id="joinBtn" class="secondary">加入房间</button></div></div>
      <div class="features"><span>⚡ 实时同步画板</span><span>👯 最多 12 人一起玩</span><span>🏆 猜词积分排行榜</span></div>
      <p id="lobbyError" class="error"></p>
    </section>
    <section id="game" class="game hidden">
      <div class="roombar panel"><div><small>房间邀请码</small><strong id="codeDisplay">-----</strong></div><button id="copyBtn" class="secondary">复制邀请链接</button><div class="round-info" id="roundInfo">等待开始</div></div>
      <div class="game-grid">
        <section class="board-panel panel">
          <div class="board-head"><div><span class="status-dot"></span><span id="turnLabel">等待玩家加入…</span></div><div class="timer" id="timer">01:00</div></div>
          <div class="wordbar"><span id="wordHint">房主开始后即可开玩</span><span id="wordLength"></span></div>
          <div class="canvas-wrap"><canvas id="canvas" width="1000" height="620"></canvas><div id="canvasEmpty" class="canvas-empty">🖍️<br>画板准备就绪</div></div>
          <div class="tools"><div class="colors" id="colors"><button class="swatch selected" data-color="#24253a" style="--swatch:#24253a"></button><button class="swatch" data-color="#ff647c" style="--swatch:#ff647c"></button><button class="swatch" data-color="#ffb347" style="--swatch:#ffb347"></button><button class="swatch" data-color="#46b98b" style="--swatch:#46b98b"></button><button class="swatch" data-color="#4d8dff" style="--swatch:#4d8dff"></button><button class="swatch" data-color="#a779f7" style="--swatch:#a779f7"></button></div><input id="brushSize" aria-label="画笔粗细" type="range" min="2" max="24" value="6"><button id="eraserBtn" class="toolbtn">橡皮擦</button><button id="clearBtn" class="toolbtn">清空</button></div>
          <div class="draw-note" id="drawNote">只有本轮画手可以在画板上作画</div>
        </section>
        <aside class="side">
          <section class="panel players-panel"><div class="section-title">玩家列表 <span id="playerCount">0/12</span></div><div id="players"></div><button id="startBtn" class="primary start">开始游戏</button><p id="hostHint" class="muted">房主可开始游戏 · 至少需要 2 人</p></section>
          <section class="panel chat-panel"><div class="section-title">猜词聊天室 <span>💬</span></div><div id="messages" class="messages"><div class="welcome">欢迎来到画画现场！<br>猜中答案就能获得积分 ✨</div></div><form id="chatForm" class="chat-form"><input id="chatInput" maxlength="120" placeholder="输入你的猜测…" autocomplete="off"><button aria-label="发送" class="send" type="submit">➤</button></form></section>
        </aside>
      </div>
    </section>
  </main>
  <footer>一起开画 · 和朋友共享每一个离谱的作品 <span>为好友聚会而设计 ♡</span></footer>
</div>
<div id="toast" class="toast"></div>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
</body></html>
